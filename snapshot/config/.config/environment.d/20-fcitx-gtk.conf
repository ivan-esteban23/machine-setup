# Omarchy ships INPUT_METHOD/QT_IM_MODULE/XMODIFIERS/SDL_IM_MODULE in
# 10-omarchy-fcitx.conf but omits GTK_IM_MODULE, which leaves every GTK app
# (file chooser, GIMP, GTK terminals, Firefox's GTK dialogs) unable to receive
# IME input. This adds it at a higher sort order without touching /usr/share.
GTK_IM_MODULE=fcitx
