# Re-enable fcitx5's notification-area icon.
#
# The packaged unit passes --disable notificationitem because it duplicated the
# tray entry Omarchy already renders. That reasoning holds for XCompose
# sequences, but it leaves no visible cue for which input method is active --
# which matters now that the group contains keyboard-us, mozc and hangul.
#
# This is a drop-in rather than an edit of /usr/share/omarchy/... so that
# `omarchy update` cannot silently revert it.
[Service]
ExecStart=
ExecStart=/usr/bin/fcitx5
